[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-decoder-zoo"
version = "0.1.0"
description = "From linear baselines to sequence models for brain-to-behavior decoding."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sanil Desai" }]
keywords = ["neural-decoding", "bci", "neuroscience", "time-series", "kalman", "sequence-models"]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
nlb = ["pynwb>=2.5", "dandi>=0.60"]
dev = ["pytest>=7"]

[project.scripts]
ndz = "ndz.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
