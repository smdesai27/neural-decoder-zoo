[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-decoder-zoo"
version = "0.1.0"
description = "Benchmark brain-to-behavior neural decoders on synthetic and public NLB data."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Sanil Desai" }]
keywords = ["neural-decoding", "bci", "neuroscience", "time-series", "kalman", "sequence-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.urls]
Repository = "https://github.com/smdesai27/neural-decoder-zoo"
Issues = "https://github.com/smdesai27/neural-decoder-zoo/issues"

[project.optional-dependencies]
torch = ["torch>=2.0"]
nlb = ["pynwb>=2.5", "dandi>=0.60"]
dev = ["pytest>=7"]

[project.scripts]
ndz = "ndz.run:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
